<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi cuenta | Kernel Shield</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08090d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<link rel="canonical" href="https://kernelshield.xyz/cuenta.html">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-main.css">
<link rel="stylesheet" href="styles-auth.css">
</head>
<body>
<div class="bg-grid"></div>
<header>
  <div class="wrap">
    <nav>
      <a href="/" class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z" stroke="#3d7fff" stroke-width="1.6"/><path d="M8.5 12l2.3 2.3L16 9" stroke="#33d69f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="k">Kernel</span><span class="s">Shield</span>
      </a>
      <div class="nav-cta">
        <a href="/" class="btn btn-ghost">Ir al sitio</a>
        <a href="https://discord.gg/Twh4CVvZ3A" target="_blank" rel="noopener noreferrer" class="btn btn-discord">Discord</a>
        <button type="button" class="btn btn-ghost" id="logoutBtn">Cerrar sesión</button>
      </div>
    </nav>
  </div>
</header>
<main class="auth-main" id="accRoot">
  <div class="wrap">
    <div class="acc-hero">
      <div>
        <h1>Hola, <span id="accName">…</span> 👋</h1>
        <p>Este es tu panel: aquí ves tus cotizaciones y tus servicios activos.</p>
      </div>
    </div>

    <div class="acc-grid">
      <div class="acc-card">
        <h2>Tus servicios VPS</h2>
        <div class="acc-list" id="accServices"><p class="acc-empty">Cargando…</p></div>
      </div>

      <div>
        <div class="acc-card" style="margin-bottom:20px">
          <h2>Tu perfil</h2>
          <div class="acc-profile-row"><span>Nombre</span><b id="accProfileName">…</b></div>
          <div class="acc-profile-row"><span>Correo</span><b id="accEmail">…</b></div>
          <div class="acc-profile-row"><span>Miembro desde</span><b id="accSince">…</b></div>
          <div class="acc-verify-pill" id="accVerifyPill" hidden>⚠️ Confirma tu correo para desbloquear todo</div>
        </div>

        <div class="acc-card">
          <h2>Cotizaciones</h2>
          <div class="acc-list" id="accQuotes"><p class="acc-empty">Cargando…</p></div>
          <a href="/#vps" class="btn btn-primary btn-full" style="margin-top:16px">Solicitar nuevo VPS</a>
        </div>
      </div>
    </div>

    <div class="acc-card" style="margin-top:20px">
      <h2>Facturas</h2>
      <div class="acc-list" id="accInvoices"><p class="acc-empty">Cargando…</p></div>
    </div>
  </div>
</main>
<script src="app-auth.js"></script>
</body>
</html>
