<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña | Kernel Shield</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08090d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<link rel="canonical" href="https://kernelshield.xyz/restablecer.html">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-main.css">
<link rel="stylesheet" href="styles-auth.css">
</head>
<body>
<div class="bg-grid"></div>
<header>
  <div class="wrap">
    <nav>
      <a href="/" class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z" stroke="#3d7fff" stroke-width="1.6"/><path d="M8.5 12l2.3 2.3L16 9" stroke="#33d69f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="k">Kernel</span><span class="s">Shield</span>
      </a>
      <div class="nav-cta">
        <a href="/login.html" class="btn btn-ghost">Volver al login</a>
      </div>
    </nav>
  </div>
</header>
<main class="auth-main">
  <div class="wrap auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Elige tu nueva contraseña</h1>
        <p>Este enlace es de un solo uso y vence a los 30 minutos.</p>
      </div>
      <div class="auth-alert" id="resetAlert"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="rpPassword">Nueva contraseña</label>
          <input type="password" id="rpPassword" required minlength="8" maxlength="200" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="rpPassword2">Confirmar contraseña</label>
          <input type="password" id="rpPassword2" required minlength="8" maxlength="200" placeholder="Repite tu contraseña" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitResetBtn">Guardar nueva contraseña</button>
      </form>

      <div class="auth-center-status" id="resetSuccess" hidden>
        <div class="success-icon">✓</div>
        <h3>Contraseña actualizada</h3>
        <p>Ya puedes iniciar sesión con tu nueva contraseña. Por seguridad, cerramos cualquier sesión activa anterior.</p>
        <a href="/login.html" class="btn btn-primary" style="margin-top:16px">Iniciar sesión</a>
      </div>
    </div>
  </div>
</main>
<script src="app-auth.js"></script>
</body>
</html>
